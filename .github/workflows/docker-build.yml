name: Release and Push RPi5 Image

on:
  push:
    tags:
      - 'v*' # Okidač je bilo koji tag koji počinje sa 'v' (npr. v1.0, v2.1.3)

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Neophodno za kreiranje GitHub Release-a
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # 1. Postavljanje QEMU i Buildx-a
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 2. Login na Docker Hub
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 3. Ekstrakcija verzije iz taga (npr. v1.2.3)
      - name: Get tag version
        id: vars
        run: echo "tag=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      # 4. Build i Push (Tagujemo sa verzijom i sa 'latest')
      - name: Build and Push
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/arm64
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/rpi-server:${{ steps.vars.outputs.tag }}
            ${{ secrets.DOCKERHUB_USERNAME }}/rpi-server:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # 5. Automatsko kreiranje GitHub Release-a
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.vars.outputs.tag }}
          name: Release ${{ steps.vars.outputs.tag }}
          body: |
            ### 🚀 Docker Image Info
            Preuzmite verziju za Raspberry Pi 5:
            `docker pull ${{ secrets.DOCKERHUB_USERNAME }}/rpi-server:${{ steps.vars.outputs.tag }}`
            
            **Arhitektura:** linux/arm64
            **Status:** Automatski generisano iz GitHub Actions.
          draft: false
          prerelease: false