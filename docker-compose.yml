services:
  rpi-server:
    # Image name on Docker Hub (or build locally)
    image: yoloprojekat/rpi-server:latest
    container_name: rpi_stream_server
    restart: unless-stopped

    # Host networking for zero-latency MJPEG streaming & direct port 1607 binding
    network_mode: "host"

    # Grants full hardware privileges for libcamera, dma_heap, and RP1 GPIO
    privileged: true

    # Mount device tree and udev for dynamic camera node discovery
    volumes:
      - /run/udev:/run/udev:ro
      - /dev:/dev

    # Shared memory allocation to prevent camera/DMA frame buffer starvation
    shm_size: '512m'

    # SD Card Protection: limits container log size
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

    # Auto-recovery healthcheck via dedicated /health endpoint using Python urllib
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:1607/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
