services:

  rpi-server:

    # Replace 'your_dockerhub_username' with your actual Docker Hub username

    image: yoloprojekat/rpi-server:latest

    container_name: rpi_stream_server

    restart: unless-stopped

    # Host networking for zero-latency MJPEG streaming (runs directly on port 1607)

    network_mode: "host"

    # Grants required permissions for dynamic hardware (libcamera, dma_heap, gpio)

    privileged: true

    # Mounts the entire /dev tree so dynamic camera nodes are always accessible

    volumes:

      - /run/udev:/run/udev:ro

      - /dev:/dev

    # Hardware access permissions for the container (kept for good measure)

    # Increased shared memory to prevent camera frame buffer crashes

    shm_size: '512m'

    # SD Card Protection: limits log size to prevent filling up the drive

    logging:

      driver: "json-file"

      options:

        max-size: "10m"

        max-file: "3"

    # Auto-recovery if the HTTP stream stops responding

    healthcheck:

      test: ["CMD", "curl", "-f", "http://localhost:1607/video_feed"]

      interval: 30s

      timeout: 10s

      retries: 3

      start_period: 15s
